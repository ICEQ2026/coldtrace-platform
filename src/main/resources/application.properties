# Spring Application Name
spring.application.name=ColdTrace Platform

# Default to development when no explicit profile is provided.
spring.profiles.default=dev

# Spring DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/coldtrace-platform?useSSL=true&requireSSL=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA Configuration
spring.jpa.show-sql=false

# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=com.acme.coldtrace.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Application Information for Documentation
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# i18n message bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# JWT Authorization Configuration
authorization.jwt.secret=${JWT_SECRET:ColdTraceDevelopmentJwtSecretKeyForHS256NeedsAtLeast32Bytes}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}

# Social Authentication Configuration
authentication.social.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
authentication.social.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
authentication.social.google.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:}
authentication.social.google.token-uri=${GOOGLE_OAUTH_TOKEN_URI:https://oauth2.googleapis.com/token}
authentication.social.google.jwks-uri=${GOOGLE_OIDC_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
authentication.social.google.issuer=${GOOGLE_OIDC_ISSUER:https://accounts.google.com}
authentication.social.apple.client-id=${APPLE_OAUTH_CLIENT_ID:}
authentication.social.apple.redirect-uri=${APPLE_OAUTH_REDIRECT_URI:}
authentication.social.apple.token-uri=${APPLE_OAUTH_TOKEN_URI:https://appleid.apple.com/auth/token}
authentication.social.apple.jwks-uri=${APPLE_OIDC_JWKS_URI:https://appleid.apple.com/auth/keys}
authentication.social.apple.issuer=${APPLE_OIDC_ISSUER:https://appleid.apple.com}
authentication.social.apple.team-id=${APPLE_TEAM_ID:}
authentication.social.apple.key-id=${APPLE_KEY_ID:}
authentication.social.apple.private-key=${APPLE_PRIVATE_KEY:}

# Password Reset Email Configuration
coldtrace.iam.password-reset.email-enabled=${PASSWORD_RESET_EMAIL_ENABLED:false}
coldtrace.iam.password-reset.email-from=${PASSWORD_RESET_EMAIL_FROM:no-reply@coldtrace.example}
coldtrace.iam.password-reset.frontend-reset-url=${PASSWORD_RESET_FRONTEND_RESET_URL:http://localhost:4200/identity-access/reset-password}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}

# CORS Configuration
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://127.0.0.1:4200,https://coldtrace-frontend-liard.vercel.app,https://coldtrace-frontend-*.vercel.app,https://coldtrace-frontend-git-*-mauricio-pajes-projects.vercel.app}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.exposed-headers=${CORS_EXPOSED_HEADERS:Location}
cors.max-age=${CORS_MAX_AGE:3600}

# ColdTrace AI Assistance Configuration
coldtrace.ai.enabled=${AI_ASSISTANCE_ENABLED:true}
coldtrace.ai.provider=${AI_MODEL_PROVIDER:ollama}
coldtrace.ai.model-name=${AI_MODEL_NAME:gemma3:4b}
coldtrace.ai.timeout=${AI_REQUEST_TIMEOUT:30s}

# ColdTrace Billing Plan Catalog Configuration
coldtrace.billing.plan-catalog.operations-stripe-price-id=${STRIPE_OPERATIONS_PRICE_ID:}
coldtrace.billing.plan-catalog.compliance-ai-stripe-price-id=${STRIPE_COMPLIANCE_AI_PRICE_ID:}
coldtrace.billing.stripe.secret-key=${STRIPE_SECRET_KEY:}
coldtrace.billing.stripe.webhook-signing-secret=${STRIPE_WEBHOOK_SECRET:}
coldtrace.billing.stripe.checkout-success-url=${BILLING_CHECKOUT_SUCCESS_URL:http://localhost:4200/identity-access/billing?checkout=success&session_id={CHECKOUT_SESSION_ID}}
coldtrace.billing.stripe.checkout-cancel-url=${BILLING_CHECKOUT_CANCEL_URL:http://localhost:4200/identity-access/billing?checkout=cancel}
coldtrace.billing.stripe.customer-portal-return-url=${BILLING_CUSTOMER_PORTAL_RETURN_URL:http://localhost:4200/identity-access/billing?portal=return}

# Spring AI Chat Model Configuration
spring.ai.model.chat=${AI_MODEL_PROVIDER:ollama}
spring.ai.retry.max-attempts=${AI_RETRY_MAX_ATTEMPTS:2}
spring.ai.retry.backoff.initial-interval=${AI_RETRY_INITIAL_INTERVAL:1s}
spring.ai.retry.backoff.max-interval=${AI_RETRY_MAX_INTERVAL:5s}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${AI_MODEL_NAME:gemma3:4b}
spring.ai.ollama.chat.format=${OLLAMA_CHAT_FORMAT:json}
spring.ai.ollama.chat.temperature=${AI_TEMPERATURE:0.2}
spring.ai.ollama.chat.num-ctx=${OLLAMA_NUM_CTX:8192}
spring.ai.ollama.chat.num-predict=${OLLAMA_NUM_PREDICT:2000}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${AI_MODEL_NAME:gpt-5.4-mini}
