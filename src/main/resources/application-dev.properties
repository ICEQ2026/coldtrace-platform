# Environment: Development
environment.name=dev

# Load local secrets/config for development without committing them.
spring.config.import=optional:file:.env.local[.properties]

# Spring DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/coldtrace-platform?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA Configuration
spring.jpa.show-sql=true
