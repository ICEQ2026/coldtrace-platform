# Environment: Development
environment.name=dev

# Load local secrets/config for development without committing them.
spring.config.import=optional:file:.env.local[.properties]

# Spring DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/coldtrace-platform?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA Configuration
spring.jpa.show-sql=true

# AI Assistance defaults for local development
coldtrace.ai.provider=${AI_MODEL_PROVIDER:ollama}
coldtrace.ai.model-name=${AI_MODEL_NAME:gemma3:4b}
coldtrace.ai.timeout=${AI_REQUEST_TIMEOUT:120s}
spring.ai.model.chat=${AI_MODEL_PROVIDER:ollama}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${AI_MODEL_NAME:gemma3:4b}
spring.ai.ollama.chat.format=${OLLAMA_CHAT_FORMAT:json}
spring.ai.ollama.chat.temperature=${AI_TEMPERATURE:0.2}
spring.ai.ollama.chat.num-ctx=${OLLAMA_NUM_CTX:8192}
spring.ai.ollama.chat.num-predict=${OLLAMA_NUM_PREDICT:2000}
